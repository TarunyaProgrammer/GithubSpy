<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1F1D1A"/>
      <stop offset="100%" stop-color="#121110"/>
    </linearGradient>
    
    <!-- Amber Reticle Glow -->
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#EAA036" flood-opacity="0.6"/>
    </filter>

    <!-- Subtle Outer Border Gradient -->
    <linearGradient id="borderGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4A453E"/>
      <stop offset="100%" stop-color="#242220"/>
    </linearGradient>
  </defs>

  <!-- Outer Rounded Squircle Frame -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#badgeGrad)" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Concentric Radar Sweep Rings -->
  <circle cx="64" cy="64" r="48" stroke="#38342F" stroke-width="1.5" stroke-dasharray="4 6"/>
  <circle cx="64" cy="64" r="32" stroke="#2D2A26" stroke-width="1.2" stroke-dasharray="2 4"/>

  <!-- Minimalist GitHub Silhouette (Scaled to 64x64 at center) -->
  <g transform="translate(64, 64) scale(2.8) translate(-16, -16)">
    <path d="M16 5C9.92 5 5 9.92 5 16C5 20.87 8.16 24.99 12.54 26.45C13.09 26.55 13.29 26.21 13.29 25.92C13.29 25.66 13.28 24.77 13.27 23.86C10.21 24.52 9.57 22.54 9.57 22.54C9.07 21.27 8.35 20.93 8.35 20.93C7.35 20.25 8.43 20.27 8.43 20.27C9.53 20.35 10.11 21.41 10.11 21.41C11.09 23.09 12.69 22.61 13.31 22.33C13.41 21.62 13.69 21.13 14 20.86C11.55 20.58 8.98 19.64 8.98 15.42C8.98 14.22 9.41 13.23 10.12 12.46C10.01 12.18 9.63 11.06 10.23 9.55C10.23 9.55 11.16 9.25 13.27 10.68C14.15 10.43 15.08 10.31 16 10.31C16.92 10.31 17.85 10.43 18.73 10.68C20.84 9.25 21.77 9.55 21.77 9.55C22.37 11.06 21.99 12.18 21.88 12.46C22.59 13.23 23.02 14.22 23.02 15.42C23.02 19.65 20.44 20.58 17.98 20.85C18.37 21.19 18.72 21.84 18.72 22.84C18.72 24.28 18.71 25.44 18.71 25.79C18.71 26.09 18.91 26.43 19.47 26.32C23.84 24.85 27 20.74 27 16C27 9.92 22.08 5 16 5Z" fill="#F7F5F0"/>
  </g>

  <!-- Precision Radar Targeting Crosshairs (#EAA036 Honey Amber) -->
  <line x1="64" y1="46" x2="64" y2="82" stroke="#EAA036" stroke-width="2.5" stroke-linecap="round" filter="url(#amberGlow)"/>
  <line x1="46" y1="64" x2="82" y2="64" stroke="#EAA036" stroke-width="2.5" stroke-linecap="round" filter="url(#amberGlow)"/>

  <!-- Central Targeting Pulse Beacon -->
  <circle cx="64" cy="64" r="4.5" fill="#EAA036" filter="url(#amberGlow)"/>
  <circle cx="64" cy="64" r="2" fill="#161514"/>
</svg>
